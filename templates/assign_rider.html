{% extends 'base.html' %} {% block title %}Assign Rider{% endblock %} {% block
content %}
<h1 class="text-3xl font-bold text-blue-600 mb-4">Assign Rider to Order</h1>
<form
  id="assignRiderForm"
  class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto"
>
  <div class="mb-4">
    <label for="order_id" class="block text-gray-700">Order ID</label>
    <input
      type="number"
      id="order_id"
      name="order_id"
      class="w-full p-2 border rounded"
      required
    />
  </div>
  <button
    type="submit"
    class="bg-blue-500 text-white p-2 rounded w-full hover:bg-blue-600"
  >
    Assign Rider
  </button>
</form>
<div id="result" class="mt-4"></div>
<script>
  document
    .getElementById("assignRiderForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const order_id = parseInt(document.getElementById("order_id").value);
      const resultDiv = document.getElementById("result");
      try {
        const response = await fetch(`/assign_rider/${order_id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });
        const data = await response.json();
        if (response.ok) {
          resultDiv.innerHTML = `<p class="text-green-600">${data.message}${
            data.rider_id ? " Rider ID: " + data.rider_id : ""
          }</p>`;
        } else {
          resultDiv.innerHTML = `<p class="text-red-600">Error: ${data.error}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
      }
    });
</script>
{% endblock %}
