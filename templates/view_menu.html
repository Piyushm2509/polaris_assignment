{% extends 'base.html' %} {% block title %}View Menu{% endblock %} {% block
content %}
<h1 class="text-3xl font-bold text-blue-600 mb-4">View Restaurant Menu</h1>
<form
  id="viewMenuForm"
  class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto"
>
  <div class="mb-4">
    <label for="restaurant_id" class="block text-gray-700">Restaurant ID</label>
    <input
      type="number"
      id="restaurant_id"
      name="restaurant_id"
      class="w-full p-2 border rounded"
      required
    />
  </div>
  <button
    type="submit"
    class="bg-blue-500 text-white p-2 rounded w-full hover:bg-blue-600"
  >
    View Menu
  </button>
</form>
<div id="result" class="mt-4"></div>
<script>
  document
    .getElementById("viewMenuForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const restaurant_id = parseInt(
        document.getElementById("restaurant_id").value
      );
      const resultDiv = document.getElementById("result");
      try {
        const response = await fetch(`/menu/${restaurant_id}`);
        const data = await response.json();
        if (response.ok) {
          console.log(data); // ✅ See what is returned
          resultDiv.innerHTML = `<h2 class="text-2xl font-semibold mb-2">Menu for ${data.restaurant_name}</h2>`;

          if (data.menu.length === 0) {
            resultDiv.innerHTML += `<p class="text-gray-600">No items found for this restaurant.</p>`;
          } else {
            data.menu.forEach((item) => {
              resultDiv.innerHTML += `
        <div class="bg-white p-4 rounded-lg shadow-md mb-2">
          <p><strong>${item.item_name}</strong> - ₹${item.price.toFixed(2)}</p>
          <p>Item ID: ${item.menu_id}</p>
        </div>`;
            });
          }
        } else {
          resultDiv.innerHTML = `<p class="text-red-600">Error: ${data.error}</p>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="text-red-600">Error: ${error.message}</p>`;
      }
    });
</script>
{% endblock %}
